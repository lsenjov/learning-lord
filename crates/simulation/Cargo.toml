[package]
name = "learning-lord-simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
imbl = { version = "7.0.2", features = ["serde"] }
rand = { version = "0.10.3", default-features = false, features = ["sys_rng", "serde"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
ron = { version = "0.12.2", features = ["integer128"] }

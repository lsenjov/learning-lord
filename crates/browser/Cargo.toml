[package]
name = "learning-lord-browser"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = ["Document",
				 "Element",
				 "Window",
				 "WebSocket",
				 "MessageEvent",
				 "ErrorEvent",
				 "CloseEvent",
				 "BinaryType",
				 "console"]
